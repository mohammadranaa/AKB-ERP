# Mounted into the web container on the AWS server only.
# Requests reach nginx from Caddy (10.89.0.10); take the client's real address from the X-Forwarded-For
# header Caddy sets, and from nowhere else. The API's sign-in rate limit counts per real address.
set_real_ip_from 10.89.0.10;
real_ip_header X-Forwarded-For;
real_ip_recursive off;
